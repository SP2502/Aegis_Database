name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.x' # latest patch in the locally validated minor series
          cache: false
      - run: |
          test -z "$(gofmt -l cmd internal pkg)"
          go vet ./...
          go test ./...
          go test -race ./...
          bash scripts/offline-smoke.sh
          mkdir -p bin
          go build -trimpath -buildvcs=false -o bin/aegis-builder ./cmd/aegis-builder
          go build -trimpath -buildvcs=false -o bin/aegis-keygen ./cmd/aegis-keygen
          go build -trimpath -buildvcs=false -o bin/aegis-verify ./cmd/aegis-verify
          python3 scripts/test-publication.py
      - name: Fuzz untrusted inputs
        run: |
          go test ./internal/parser -run '^$' -fuzz FuzzParse -fuzztime 5s -parallel 2
          go test ./pkg/dataset -run '^$' -fuzz FuzzOpen -fuzztime 5s -parallel 2
          go test ./pkg/release -run '^$' -fuzz FuzzManifest -fuzztime 5s -parallel 2
